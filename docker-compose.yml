version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hominun_db
    environment:
      POSTGRES_DB: hominun_rpg
      POSTGRES_USER: hominun
      POSTGRES_PASSWORD: hominun_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hominun -d hominun_rpg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
